# ── Kitty config (FiraCode + ligatures + copy-on-select + Catppuccin Frappe) ──

# Fonts
font_family           FiraCode Nerd Font Mono
bold_font             auto
italic_font           auto
bold_italic_font      auto
font_size             12.0

# Ligatures
disable_ligatures     never

# Selection / copy
copy_on_select        yes
strip_trailing_spaces smart

# Behavior
confirm_os_window_close 0
enable_audio_bell     no
scrollback_lines      10000
detect_urls           yes

# Cursor
cursor_shape          block
cursor_blink_interval 0

# Padding
window_padding_width  6

# Transparency (Wayland GNOME: compositor handles blur; kitty controls opacity)
background_opacity    0.78

# ── Catppuccin Frappe colors ──
background            #303446
foreground            #c6d0f5
selection_background  #414559
selection_foreground  #c6d0f5
cursor                #f2d5cf

active_tab_foreground   #303446
active_tab_background   #c6d0f5
inactive_tab_foreground #a5adce
inactive_tab_background #292c3c
tab_bar_background      #232634
border_color            #232634

color0   #51576d
color1   #e78284
color2   #a6d189
color3   #e5c890
color4   #8caaee
color5   #ca9ee6
color6   #81c8be
color7   #c6d0f5

color8   #626880
color9   #ef9f76
color10  #a6d189
color11  #e5c890
color12  #8caaee
color13  #f4b8e4
color14  #99d1db
color15  #f2d5cf

# Keybindings
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard
map ctrl+equal       increase_font_size
map ctrl+minus       decrease_font_size
map ctrl+0           reset_font_size

# Let kitty draw a header bar (required on GNOME Wayland)
hide_window_decorations system

# Make the titlebar use GNOME's system color (respects light/dark)
wayland_titlebar_color system
